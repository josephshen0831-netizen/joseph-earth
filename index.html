</style><style>:root {
  --joseph-chrome: #b8d8ff;
  --joseph-violet: #8d78ff;
  --joseph-copper: #e8a75f;
}

#lovable-badge {
  display: none !important;
}

body.pre-enter main {
  transform: scale(1.045);
  filter: blur(15px) saturate(0.45) brightness(0.48);
}

body.creator-info-open {
  overflow: hidden;
}

main {
  transition: transform 1.8s cubic-bezier(.16, 1, .3, 1),
              filter 1.8s cubic-bezier(.16, 1, .3, 1);
}

body::before {
  position: fixed;
  z-index: 5;
  inset: 0;
  content: "";
  pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, transparent 0 3px, rgba(133, 215, 255, .026) 4px),
    linear-gradient(90deg, rgba(72, 164, 217, .04) 1px, transparent 1px),
    linear-gradient(rgba(72, 164, 217, .035) 1px, transparent 1px);
  background-size: 100% 4px, 80px 80px, 80px 80px;
  mask-image: radial-gradient(circle at center, transparent 0 22%, #000 86%);
  opacity: .7;
}

.earth-gate {
  position: fixed;
  inset: 0;
  z-index: 2000000;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: #eef5ff;
  background:
    radial-gradient(circle at 50% 48%, rgba(92, 116, 168, .23), transparent 22%),
    radial-gradient(circle at 50% 55%, rgba(108, 71, 146, .13), transparent 40%),
    #020307;
  transition: opacity 1.25s ease, visibility 1.25s;
}

.earth-gate::before {
  content: "";
  position: absolute;
  width: min(54vw, 620px);
  aspect-ratio: 1;
  border-radius: 50%;
  background:
    radial-gradient(circle at 33% 24%, rgba(255,255,255,.9), transparent 4%),
    radial-gradient(circle at 37% 31%, #89a8ce 0 7%, transparent 20%),
    radial-gradient(circle at 64% 68%, #4a315a 0 4%, transparent 25%),
    radial-gradient(circle at 50% 50%, #55789e, #172538 46%, #03060b 72%);
  box-shadow: inset -70px -45px 110px #000, inset 30px 20px 70px rgba(210,235,255,.2),
              0 0 110px rgba(103,143,196,.2);
  opacity: .72;
  animation: gate-earth 18s linear infinite;
}

.earth-gate::after {
  content: "";
  position: absolute;
  inset: -30%;
  background-image: radial-gradient(circle, rgba(255,255,255,.72) 0 1px, transparent 1.4px);
  background-size: 89px 83px;
  opacity: .16;
  animation: stars-drift 28s linear infinite;
}

.earth-gate.is-entered {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.gate-copy {
  position: relative;
  z-index: 2;
  width: min(92vw, 1050px);
  text-align: center;
  text-transform: uppercase;
}

.gate-kicker {
  margin: 0 0 1.4rem;
  font: 400 .65rem/1 "Barlow Condensed", sans-serif;
  letter-spacing: .62em;
  color: rgba(220,233,255,.58);
}

.gate-title,
.earth-disco-title .disco-line {
  color: transparent;
  background:
    linear-gradient(108deg,
      #071522 0%,
      #568fc4 8%,
      #f4fcff 14%,
      #487ca9 21%,
      #172f4b 29%,
      #a6e8ff 38%,
      #ffffff 43%,
      #4d6fa4 50%,
      #9b69d1 59%,
      #f2b66f 67%,
      #dff8ff 76%,
      #477aaa 86%,
      #091a2b 100%);
  background-size: 360% 100%;
  background-clip: text;
  -webkit-background-clip: text;
  filter:
    drop-shadow(-2px -2px 0 rgba(214, 244, 255, .34))
    drop-shadow(0 0 18px rgba(118, 204, 255, .5))
    drop-shadow(0 17px 20px rgba(0, 0, 0, .86));
  animation: liquid-chrome 4.4s ease-in-out infinite;
}

.gate-title {
  margin: 0;
  font: 300 clamp(3.1rem, 8.5vw, 8.6rem)/.77 "Cormorant Garamond", serif;
  letter-spacing: -.045em;
}

.gate-deck {
  width: min(90vw, 570px);
  margin: 2.2rem auto 2.5rem;
  font: 300 clamp(.75rem, 1.2vw, .95rem)/1.7 "Barlow", sans-serif;
  letter-spacing: .12em;
  text-transform: none;
  color: rgba(230,238,250,.7);
}

.gate-enter {
  position: relative;
  width: 108px;
  height: 108px;
  border: 1px solid rgba(197,220,248,.42);
  border-radius: 50%;
  color: #eaf5ff;
  background: rgba(4,8,15,.36);
  backdrop-filter: blur(12px);
  font: 400 .62rem/1 "Barlow Condensed", sans-serif;
  letter-spacing: .46em;
  text-indent: .46em;
  cursor: pointer;
  transition: transform .6s cubic-bezier(.16,1,.3,1), background .4s, box-shadow .4s;
}

.gate-enter:hover {
  transform: scale(1.12);
  background: rgba(111,146,190,.18);
  box-shadow: 0 0 0 12px rgba(153,197,245,.04), 0 0 60px rgba(124,170,225,.24);
}

.earth-disco-title {
  position: fixed;
  z-index: 8;
  top: clamp(6px, 1.2vh, 16px);
  left: 50%;
  width: min(99vw, 1660px);
  transform: translateX(-50%) perspective(740px) rotateX(-11deg) rotateZ(-.65deg);
  pointer-events: none;
  text-align: center;
  font: 700 clamp(3.2rem, 8.1vw, 9.6rem)/.67 "Cormorant Garamond", serif;
  font-style: normal;
  letter-spacing: -.055em;
  text-transform: uppercase;
  opacity: .98;
  transform-style: preserve-3d;
  isolation: isolate;
  animation: title-float 4.6s ease-in-out infinite;
}

.earth-disco-title::before {
  position: absolute;
  z-index: -4;
  inset: -28% 4% -18%;
  content: "";
  border-radius: 50%;
  background:
    radial-gradient(ellipse at 50% 54%, rgba(101, 174, 226, .2), transparent 52%),
    conic-gradient(from 90deg at 50% 50%, transparent, rgba(143, 98, 208, .12), transparent 34%, rgba(229, 158, 84, .11), transparent 68%);
  filter: blur(22px);
  mix-blend-mode: screen;
  animation: title-aura 7s linear infinite;
}

.disco-line {
  position: relative;
  display: block;
  width: max-content;
  margin: 0 auto;
  -webkit-text-stroke: .7px rgba(226, 245, 255, .35);
  transform: skewX(-5deg);
  transform-style: preserve-3d;
}

.disco-line::before,
.disco-line::after {
  position: absolute;
  inset: 0;
  content: attr(data-text);
  pointer-events: none;
}

.disco-line::before {
  z-index: -2;
  color: #0b2339;
  -webkit-text-stroke: 1px rgba(115, 196, 238, .28);
  transform: translate3d(.065em, .09em, -28px);
  text-shadow:
    .02em .02em 0 #315f84,
    .04em .04em 0 #244a70,
    .06em .06em 0 #193650,
    .08em .08em 0 #0a1b2b,
    .12em .15em .18em rgba(0, 0, 0, .95);
}

.disco-line::after {
  z-index: 2;
  color: transparent;
  background:
    repeating-linear-gradient(112deg,
      transparent 0 8%,
      rgba(255, 255, 255, .94) 8.8% 9.5%,
      transparent 10.2% 19%),
    linear-gradient(90deg, transparent 18%, rgba(198, 239, 255, .8) 48%, transparent 62%);
  background-size: 210% 100%, 260% 100%;
  background-clip: text;
  -webkit-background-clip: text;
  mix-blend-mode: screen;
  opacity: .7;
  animation: disco-scan 3.6s linear infinite;
}

.disco-line-earth {
  margin-top: .2em;
  margin-left: 36%;
  font-size: .64em;
  letter-spacing: .19em;
  text-indent: .19em;
  transform: skewX(-5deg) rotateZ(1.35deg);
}

.legacy-title-copy > p:first-child,
.legacy-title-copy > h1 {
  opacity: 0;
  visibility: hidden;
}

.earth-hover-chroma {
  position: fixed;
  z-index: 4;
  width: 190px;
  height: 190px;
  margin: -95px 0 0 -95px;
  border-radius: 50%;
  pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(circle at 38% 34%, rgba(255,255,255,.95), rgba(126,215,255,.7) 10%, rgba(142,87,217,.52) 32%, rgba(231,138,67,.28) 50%, transparent 72%);
  mix-blend-mode: color-dodge;
  filter: blur(9px) saturate(1.6);
  transition: opacity .38s ease, width .45s ease, height .45s ease, margin .45s ease;
}

.earth-hover-chroma.is-on { opacity: .72; }

.earth-tech-hud {
  position: fixed;
  z-index: 18;
  inset: clamp(12px, 1.7vw, 26px);
  pointer-events: none;
  transition: opacity .9s ease, transform 1.2s cubic-bezier(.16, 1, .3, 1);
}

body.pre-enter .earth-tech-hud {
  opacity: 0;
  transform: scale(.985);
}

.earth-tech-hud::before,
.earth-tech-hud::after {
  display: none;
}

.hud-corner {
  display: none;
}

.hud-readout {
  position: absolute;
  bottom: 10px;
  margin: 0;
  font: 500 .58rem/1 "Barlow Condensed", sans-serif;
  letter-spacing: .3em;
  color: rgba(189, 225, 245, .45);
  text-transform: uppercase;
  text-shadow: 0 0 9px rgba(84, 189, 245, .42);
}

.hud-readout-left { left: 15px; }
.hud-readout-right { right: 15px; }
.hud-readout b { color: #8fe5ff; font-weight: 500; }
.hud-readout b::before { content: "●"; margin-right: .75em; font-size: .68em; }

.creator-hand {
  position: fixed;
  z-index: 30;
  right: clamp(18px, 3vw, 48px);
  bottom: clamp(72px, 9vh, 104px);
  display: flex;
  align-items: center;
  gap: .6rem;
  padding: .2rem;
  border: 0;
  color: #edf7ff;
  background: transparent;
  cursor: pointer;
  opacity: .88;
  transition: opacity .3s ease, transform .45s cubic-bezier(.16, 1, .3, 1);
}

body.pre-enter .creator-hand {
  opacity: 0;
  pointer-events: none;
  transform: translateY(24px);
}

.creator-hand:hover,
.creator-hand:focus-visible {
  opacity: 1;
  transform: translate(-8px, -5px) rotate(-3deg) scale(1.08);
  outline: none;
}

.creator-hand-glyph {
  display: block;
  font: 400 clamp(3rem, 5vw, 5.8rem)/.65 Georgia, serif;
  color: transparent;
  background: linear-gradient(105deg, #8aa9ca, #ffffff 25%, #614878 50%, #eeb06d 68%, #b9e6ff);
  background-clip: text;
  -webkit-background-clip: text;
  filter: drop-shadow(0 0 15px rgba(153, 213, 255, .32)) drop-shadow(0 8px 9px #000);
  animation: hand-beckon 2.8s ease-in-out infinite;
}

.creator-hand-label {
  max-width: 5rem;
  text-align: left;
  font: 500 .68rem/1.15 "Barlow Condensed", sans-serif;
  letter-spacing: .24em;
  text-transform: uppercase;
  text-shadow: 0 2px 8px #000;
}

.creator-panel {
  position: fixed;
  inset: 0;
  z-index: 3000000;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: clamp(4.5rem, 8vw, 8rem) clamp(1.25rem, 6vw, 7rem);
  color: #eaf2ff;
  background:
    linear-gradient(105deg, rgba(2, 3, 8, .985) 0 44%, rgba(4, 6, 13, .94)),
    radial-gradient(circle at 80% 18%, rgba(87, 61, 135, .38), transparent 38%),
    repeating-linear-gradient(90deg, transparent 0 79px, rgba(113, 205, 255, .045) 80px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(30px);
  transition: opacity .65s ease, transform .8s cubic-bezier(.16, 1, .3, 1), visibility .65s;
}

.creator-panel::before {
  position: fixed;
  inset: 0;
  content: "";
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: linear-gradient(to bottom, black, transparent 88%);
}

.creator-panel.is-open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}

.creator-close {
  position: fixed;
  z-index: 2;
  top: clamp(20px, 3.5vw, 42px);
  right: clamp(20px, 3.5vw, 48px);
  display: flex;
  align-items: center;
  gap: .7rem;
  border: 0;
  color: rgba(235, 244, 255, .72);
  background: none;
  font: 500 .68rem/1 "Barlow Condensed", sans-serif;
  letter-spacing: .3em;
  text-transform: uppercase;
  cursor: pointer;
}

.creator-close span {
  font: 300 2rem/1 "Cormorant Garamond", serif;
  transition: transform .35s ease;
}

.creator-close:hover span,
.creator-close:focus-visible span { transform: rotate(90deg); }

.creator-panel-shell {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: minmax(230px, .72fr) minmax(320px, 1.28fr);
  gap: clamp(3rem, 7vw, 9rem);
  width: min(100%, 1320px);
  margin: 0 auto;
}

.creator-panel-shell::after {
  position: absolute;
  top: -2.2rem;
  right: 0;
  width: min(42%, 320px);
  height: 1px;
  content: "";
  background: linear-gradient(90deg, transparent, rgba(123, 218, 255, .65));
  box-shadow: 0 0 12px rgba(103, 208, 255, .35);
}

.creator-portrait-column {
  position: sticky;
  top: 7rem;
  align-self: start;
  justify-self: center;
  width: min(100%, 360px);
}

.creator-portrait {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  padding: 7px;
  border: 2px solid rgba(168, 223, 255, .64);
  outline: 1px solid rgba(225, 245, 255, .14);
  outline-offset: 7px;
  background:
    radial-gradient(circle at 37% 28%, rgba(224, 239, 255, .23), transparent 9%),
    linear-gradient(145deg, rgba(100, 140, 184, .4), rgba(23, 16, 36, .92) 52%, rgba(210, 139, 71, .34));
  box-shadow:
    14px 16px 0 rgba(64, 43, 94, .28),
    -12px -10px 0 rgba(93, 146, 190, .1),
    0 0 24px rgba(104, 204, 255, .12),
    0 28px 70px #000;
}

.creator-portrait::before {
  position: absolute;
  inset: 0;
  z-index: 1;
  content: "";
  background: repeating-linear-gradient(105deg, transparent 0 8px, rgba(255,255,255,.035) 9px 10px);
  mix-blend-mode: overlay;
}

.creator-portrait img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  filter: contrast(1.06) saturate(.83) brightness(.86);
}

.creator-portrait-note {
  margin: 1.8rem 0 0;
  font: 500 .66rem/1.4 "Barlow Condensed", sans-serif;
  letter-spacing: .38em;
  text-transform: uppercase;
  color: rgba(218, 232, 249, .48);
}

.creator-story { max-width: 760px; }

.creator-kicker {
  margin: 0 0 1.2rem;
  font: 500 .7rem/1 "Barlow Condensed", sans-serif;
  letter-spacing: .58em;
  text-transform: uppercase;
  color: #dba96f;
}

.creator-story h2 {
  margin: 0;
  font: 300 clamp(2.35rem, 4.7vw, 5.8rem)/.9 "Cormorant Garamond", serif;
  letter-spacing: -.065em;
  white-space: nowrap;
  color: transparent;
  background: linear-gradient(106deg, #7093b9, #fff 32%, #785b86 55%, #e6a566 75%, #bde6ff);
  background-clip: text;
  -webkit-background-clip: text;
}

.creator-manifesto {
  margin: 2.5rem 0 3.8rem;
  max-width: 680px;
  font: 300 clamp(1.08rem, 1.6vw, 1.35rem)/1.72 "Barlow", sans-serif;
  color: rgba(230, 238, 250, .78);
}

.creator-manifesto em { color: #fff; }

.creator-regions {
  border-top: 1px solid rgba(201, 223, 249, .17);
}

.creator-region {
  display: grid;
  grid-template-columns: 3.2rem 1fr;
  gap: 1.2rem;
  padding: 1.65rem 0 1.8rem;
  border-bottom: 1px solid rgba(201, 223, 249, .14);
  transition: padding-left .35s ease, background .35s ease, border-color .35s ease;
}

.creator-region:hover {
  padding-left: .7rem;
  border-color: rgba(133, 217, 255, .42);
  background: linear-gradient(90deg, rgba(79, 175, 225, .07), transparent 72%);
}

.creator-region > span {
  padding-top: .35rem;
  font: 500 .65rem/1 "Barlow Condensed", sans-serif;
  letter-spacing: .25em;
  color: #dba96f;
}

.creator-region h3 {
  margin: 0 0 .5rem;
  font: 400 clamp(1.45rem, 2.2vw, 2rem)/1 "Cormorant Garamond", serif;
  letter-spacing: -.02em;
  color: #f2f7ff;
}

.creator-region p {
  margin: 0;
  font: 300 1rem/1.65 "Barlow", sans-serif;
  color: rgba(218, 229, 244, .64);
}

.creator-email {
  display: inline-flex;
  flex-wrap: wrap;
  gap: .8rem 1.2rem;
  margin-top: 3.6rem;
  color: #eaf5ff;
  font: 300 clamp(1.3rem, 2.3vw, 2rem)/1.2 "Cormorant Garamond", serif;
  text-decoration: none;
  transition: color .3s ease, transform .3s ease;
}

.creator-email span {
  align-self: center;
  font: 500 .64rem/1 "Barlow Condensed", sans-serif;
  letter-spacing: .36em;
  text-transform: uppercase;
  color: #dba96f;
}

.creator-email:hover,
.creator-email:focus-visible { color: #9fd8ff; transform: translateX(6px); }

.joseph-composer-credit {
  margin: 1.35rem 0 0;
  font: 500 .64rem/1.5 "Barlow Condensed", sans-serif;
  letter-spacing: .34em;
  text-transform: uppercase;
  color: rgba(222, 232, 246, .56);
}

.joseph-composer-credit span { color: #eef6ff; }

@keyframes liquid-chrome {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes title-float {
  0%, 100% { translate: 0 0; rotate: 0deg; scale: 1; }
  34% { translate: -5px -13px; rotate: -.55deg; scale: 1.012; }
  68% { translate: 7px 6px; rotate: .38deg; scale: .996; }
}

@keyframes disco-scan {
  0% { background-position: 180% 50%, 160% 50%; opacity: .36; }
  45% { opacity: .92; }
  100% { background-position: -40% 50%, -80% 50%; opacity: .42; }
}

@keyframes title-aura {
  to { transform: rotate(360deg) scale(1.08); }
}

@keyframes hand-beckon {
  0%, 100% { transform: rotate(-4deg) translateX(0); }
  50% { transform: rotate(2deg) translateX(-7px); }
}

@keyframes gate-earth { to { transform: rotate(360deg); } }
@keyframes stars-drift { to { transform: translate3d(5%, 3%, 0); } }

@media (max-width: 700px) {
  .earth-disco-title {
    top: 18px;
    width: 96vw;
    font-size: clamp(2.55rem, 12vw, 4rem);
    line-height: .72;
    transform: translateX(-50%) perspective(620px) rotateX(-9deg) rotateZ(-.5deg);
  }
  .disco-line-earth { margin-left: 20%; font-size: .7em; }
  .gate-title { line-height: .88; }
  .gate-enter { width: 88px; height: 88px; }
  .creator-hand { right: 14px; bottom: 68px; }
  .creator-hand-label { display: block; max-width: 5.8rem; font-size: .64rem; letter-spacing: .18em; }
  .creator-panel { padding: 5.5rem 1.25rem 4rem; }
  .creator-panel-shell { grid-template-columns: 1fr; gap: 3.4rem; }
  .creator-portrait-column { position: relative; top: 0; width: min(78vw, 320px); }
  .creator-story h2 { font-size: clamp(1.9rem, 9.8vw, 3.45rem); }
  .creator-manifesto { margin-top: 2rem; }
  .hud-readout-right { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .gate-title,

  .earth-disco-title::before,
  .disco-line::after,

  .earth-gate::before,
  .earth-gate::after { animation: none; }
}

        <h2 id="creator-name">Joseph Yutong Shen</h2>
        <p class="creator-manifesto">I created this interface so that people everywhere can encounter the living musical identities of distant places without leaving home. Through sound, image, and orbit, visitors can listen beyond borders and experience how traditional instruments carry memory, ritual, landscape, and everyday life. <em>Echoes Across the Earth</em> imagines our planet not as a map divided by distance, but as a shared resonant space—one in which curiosity can become empathy and music can connect cultures.</p>

  creatorHand.addEventListener("click", () => setCreatorOpen(true));
  creatorClose.addEventListener("click", () => setCreatorOpen(false));
  creatorPanel.addEventListener("click", (event) => {
    if (event.target === creatorPanel) setCreatorOpen(false);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && creatorPanel.classList.contains("is-open")) {
      setCreatorOpen(false);
    }
  });

  const regionNames = new Set([
    "China",
    "Chinese Western Region",
    "Western Regions",
    "India",
    "Ireland",
    "Latin America",
  ]);
  const addComposerCredits = () => {
    document.querySelectorAll("main h2").forEach((heading) => {
      if (!regionNames.has(heading.textContent.trim())) return;
      const detail = heading.closest(".max-w-xl") || heading.parentElement;
      if (!detail || detail.querySelector(".joseph-composer-credit")) return;
      const credit = document.createElement("p");
      credit.className = "joseph-composer-credit";
      credit.innerHTML = "Composer: <span>Joseph Yutong Shen</span>";
      detail.appendChild(credit);
    });
  };
  addComposerCredits();
  const composerObserver = new MutationObserver(addComposerCredits);
  composerObserver.observe(document.body, { childList: true, subtree: true });

  const markLegacyTitle = () => {
    const heading = [...document.querySelectorAll("main h1")].find(
      (node) => node.textContent.trim() === "Echoes Across the Earth",
    );
    if (heading) heading.parentElement.classList.add("legacy-title-copy");
    return Boolean(heading);
  };
  if (!markLegacyTitle()) {
    const titleObserver = new MutationObserver(() => {
      if (markLegacyTitle()) titleObserver.disconnect();
    });
    titleObserver.observe(document.body, { childList: true, subtree: true });
  }

  gate.querySelector(".gate-enter").addEventListener("click", () => {
    gate.classList.add("is-entered");
    document.body.classList.remove("pre-enter");
    window.setTimeout(() => gate.remove(), 1400);
  });

  const updateEarthHover = (event) => {
    if (document.body.classList.contains("pre-enter")) return;
    const canvas = document.querySelector("main canvas");
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const centerX = rect.left + rect.width * 0.5;
    const centerY = rect.top + rect.height * 0.54;
    const globeRadius = Math.min(rect.width, rect.height) * 0.235;
    const distance = Math.hypot(event.clientX - centerX, event.clientY - centerY);
    chroma.style.left = `${event.clientX}px`;
    chroma.style.top = `${event.clientY}px`;
    chroma.classList.toggle("is-on", distance < globeRadius);
  };

  window.addEventListener("pointermove", updateEarthHover, { passive: true });
  window.addEventListener("pointerleave", () => chroma.classList.remove("is-on"));
}, 1600), { once: true });
